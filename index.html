<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creaciones con IA | TecnoEducaTics</title>
  <meta name="description" content="Galería de proyectos educativos y creativos con IA.">
  <style>
    :root { --primary:#6366f1; --border:#334155; --bg:#0f172a; --card:#1e293b; --muted:#94a3b8; --text:#e2e8f0; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:linear-gradient(135deg,var(--bg) 0%,#1a1f3a 100%); color:var(--text); line-height:1.6}
    header{position:sticky;top:0;background:rgba(15,23,42,.95);border-bottom:1px solid var(--border);padding:1rem 0}
    .wrap{max-width:1200px;margin:auto;padding:0 2rem}
    nav a{color:var(--muted);text-decoration:none;margin-left:1rem}
    nav a:hover{color:var(--primary)}
    .hero{padding:3rem 0;text-align:center}
    .hero h1{font-size:2.6rem;background:linear-gradient(135deg,#6366f1,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .gallery{padding:2rem 0}
    .gallery h2{text-align:center;margin-bottom:2rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
    .card{background:linear-gradient(135deg,var(--card),rgba(30,41,59,.85));border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.25s}
    .card:hover{transform:translateY(-6px);border-color:var(--primary);box-shadow:0 12px 28px rgba(99,102,241,.18)}
    .thumb{height:150px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:linear-gradient(135deg,#6366f1,#ec4899)}
    .content{padding:1rem 1.1rem}
    .title{font-weight:700;margin:0.3rem 0}
    .desc{font-size:.92rem;color:var(--muted);margin-bottom:.8rem}
    .links a{display:inline-block;margin-right:.5rem;padding:.5rem .9rem;border-radius:6px;background:#6366f1;color:#fff;text-decoration:none;font-weight:600}
    .links a:hover{background:#4f46e5}
    footer{margin-top:3rem;border-top:1px solid var(--border);text-align:center;padding:1.5rem 0;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:800;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🤖 TecnoEducaTics</div>
      <nav>
        <a href="#galeria">Galería</a>
        <a href="#about">Sobre mí</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Creaciones con IA</h1>
      <p>Explora proyectos numerados (1.html, 2.html, …) publicados en este repositorio.</p>
    </section>

    <section id="galeria" class="gallery">
      <h2>Mis Proyectos</h2>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <footer>
    © 2025 Rubén Sierra Carrascal | TecnoEducaTics
  </footer>

  <script>
    // Cambia este número cuando agregues más archivos numerados.
    const totalProjects = 16;

    const projects = Array.from({ length: totalProjects }, (_, i) => {
      const n = i + 1;
      return {
        id: n,
        title: `Proyecto ${n}`,
        file: `${n}.html`,
        icon: "📘",
        description: `Archivo ${n}.html — proyecto numerado automáticamente.`
      };
    });

    const grid = document.getElementById("grid");
    grid.innerHTML = projects.map(p => `
      <div class="card">
        <div class="thumb">${p.icon}</div>
        <div class="content">
          <h3 class="title">${p.title}</h3>
          <p class="desc">${p.description}</p>
          <div class="links">
            <a href="${p.file}" target="_blank" rel="noopener">👁️ Ver</a>
            <a href="${p.file}" download>⬇️ Descargar</a>
          </div>
        </div>
      </div>
    `).join("");
  </script>
</body>
</html>
