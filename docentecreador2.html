<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Academia Pro | Curso Exclusivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&family=Pinyon+Script&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #0a0f1a; color: #e2e8f0; margin: 0; height: 100dvh; overflow: hidden; }
        .cert-container { width: 297mm; height: 210mm; background-color: #ffffff; position: relative; overflow: hidden; padding: 20mm; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>
    <div id="academy-app" class="flex flex-col md:flex-row h-full w-full">
        <main class="w-full md:flex-1 flex flex-col h-full bg-[#0a0f1a] relative z-20">
            <div id="video-wrapper" class="w-full aspect-video relative bg-black flex items-center justify-center">
                <div id="yt-player" class="absolute inset-0 w-full h-full"></div>
                <div id="poster-layer" class="absolute inset-0 z-40 bg-cover bg-center cursor-pointer flex items-center justify-center" onclick="startVideo()">
                    <div class="w-20 h-20 bg-blue-500/90 rounded-full flex items-center justify-center shadow-lg"><i class="ph-fill ph-play text-white text-4xl"></i></div>
                </div>
            </div>
            <div class="p-8">
                <h2 id="lesson-title" class="text-3xl font-bold text-white">Selecciona una clase</h2>
                <p id="lesson-desc" class="text-slate-400 mt-2">Explora los módulos de la barra lateral.</p>
            </div>
        </main>

        <aside class="w-full md:w-96 bg-[#151f32] overflow-y-auto">
            <div class="p-6 border-b border-slate-800">
                <h1 class="text-xl font-bold text-white">Academia Pro</h1>
            </div>
            <div id="playlist" class="p-4 space-y-6"></div>
        </aside>
    </div>

    <script>
        const modules = [
            {
                title: "Módulo 1: Fundamentos y Configuración",
                lessons: [
                    { id: '7-B-JRC58pQ', title: 'Configuración de Entorno' },
                    { id: 'afK9LermqzM', title: 'Arquitectura de Software' },
                    { id: 'S6409_LjzcU', title: 'Introducción al Despliegue' }
                ]
            },
            {
                title: "Módulo 2: Desarrollo Avanzado",
                lessons: [
                    { id: 'g_gbWsoK7IQ', title: 'Buenas Prácticas de Código' },
                    { id: '7GWP6n81my8', title: 'Patrones de Diseño' },
                    { id: 'qukfzI-jyTo', title: 'Seguridad en Aplicaciones' },
                    { id: 'kgrRb8ZQPNM', title: 'Optimización de Rendimiento' }
                ]
            },
            {
                title: "Módulo 3: Despliegue y Cloud",
                lessons: [
                    { id: 'U4uxUGfftkg', title: 'Estrategias de Cloud' },
                    { id: 'zFU-ODLcJ4I', title: 'CI/CD Pipelines' },
                    { id: '-vmfMEB9nNA', title: 'Escalabilidad en la Nube' },
                    { id: 'Nvf30k-Kpik', title: 'Monitoreo de Servicios' },
                    { id: 'Cbt6oFkI1Uo', title: 'Zero-Cost Deployments' },
                    { id: 'An9keaX12a0', title: 'Mantenimiento y Logs' }
                ]
            }
        ];

        let player;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', { videoId: modules[0].lessons[0].id });
            renderPlaylist();
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist');
            modules.forEach(mod => {
                const section = document.createElement('div');
                section.innerHTML = `<h3 class="text-blue-400 font-bold mb-3 uppercase text-xs tracking-widest">${mod.title}</h3>`;
                mod.lessons.forEach(l => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-3 hover:bg-slate-800 rounded-lg text-sm text-slate-300 transition";
                    btn.textContent = l.title;
                    btn.onclick = () => {
                        player.loadVideoById(l.id);
                        document.getElementById('lesson-title').textContent = l.title;
                        document.getElementById('poster-layer').classList.add('hidden');
                    };
                    section.appendChild(btn);
                });
                container.appendChild(section);
            });
        }

        function startVideo() { player.playVideo(); document.getElementById('poster-layer').classList.add('hidden'); }
    </script>
</body>
</html>
