<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Academia Pro | Curso Exclusivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&family=Pinyon+Script&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #0a0f1a; color: #e2e8f0; margin: 0; height: 100dvh; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .cert-container { width: 297mm; height: 210mm; background-color: #ffffff; position: relative; overflow: hidden; padding: 20mm; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); transform-origin: center top; }
        .vignette-overlay { box-shadow: inset 0 120px 80px -50px rgba(10, 15, 26, 1), inset 0 -120px 80px -50px rgba(10, 15, 26, 1); pointer-events: none; }
        @media print {
            @page { size: A4 landscape; margin: 0 !important; }
            html, body { background-color: white !important; margin: 0 !important; padding: 0 !important; width: 297mm !important; height: 210mm !important; overflow: hidden !important; }
            #academy-app, #name-modal, #certificate-modal .no-print { display: none !important; }
            #certificate-modal { position: absolute !important; top:0; left:0; display: block !important; padding: 0 !important; background: white !important; }
            .cert-container { box-shadow: none !important; transform: none !important; width: 297mm !important; height: 210mm !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="text-slate-200">

    <div id="academy-app" class="flex flex-col md:flex-row h-full w-full">
        <main class="w-full md:flex-1 flex flex-col h-auto md:h-full relative bg-[#0a0f1a] order-1 md:order-2 shrink-0 md:shrink z-20">
            <div class="w-full aspect-video md:aspect-auto md:flex-1 relative flex items-center justify-center bg-black overflow-hidden shrink-0" id="video-wrapper">
                <div id="poster-layer" class="absolute inset-0 z-40 bg-slate-900 bg-cover bg-center flex items-center justify-center cursor-pointer" onclick="startVideo()">
                    <div class="w-20 h-20 bg-blue-500/90 rounded-full flex items-center justify-center shadow-lg"><i class="ph-fill ph-play text-white text-5xl ml-2"></i></div>
                </div>
                <div id="yt-player" class="absolute inset-0 w-full h-full transform scale-[1.08] pointer-events-none"></div>
                <div class="absolute inset-0 z-10 vignette-overlay"></div>
                <div id="end-screen" class="absolute inset-0 z-40 bg-[#0a0f1a]/95 backdrop-blur-xl hidden flex-col items-center justify-center text-center p-6">
                    <i id="end-icon" class="ph-fill ph-medal text-7xl text-amber-400 mb-6"></i>
                    <h3 id="end-title" class="text-4xl font-bold text-white mb-3">Lección Superada</h3>
                    <button id="btn-next" onclick="playNext()" class="px-10 py-4 bg-blue-500 hover:bg-blue-400 text-white rounded-xl font-bold transition-all shadow-lg flex items-center gap-3 text-lg">
                        <span id="btn-next-text">Siguiente Clase</span> <i id="btn-next-icon" class="ph-bold ph-arrow-right"></i>
                    </button>
                    <button id="btn-cert" onclick="openNameModal()" style="display: none;" class="px-10 py-4 bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-xl font-bold shadow-lg mt-4">
                        <i class="ph-bold ph-certificate text-2xl"></i> Generar Constancia Legal
                    </button>
                </div>
            </div>
            <div class="p-6 md:p-10 bg-[#0a0f1a] shrink-0">
                <h2 id="lesson-title" class="text-3xl font-extrabold text-white">Selecciona una clase</h2>
            </div>
        </main>

        <aside class="w-full md:w-96 bg-[#151f32] border-l border-slate-800/50 flex flex-col flex-1 md:flex-none order-2 md:order-1 z-30 overflow-y-auto">
            <div class="p-6 border-b border-slate-800">
                <h1 class="text-xl font-bold text-white">Academia Pro</h1>
                <div class="mt-4"><div class="w-full bg-slate-800 h-2 rounded-full"><div id="progress-bar" class="bg-blue-500 h-2 rounded-full w-0"></div></div></div>
            </div>
            <div id="playlist" class="p-4 space-y-6"></div>
        </aside>
    </div>

    <!-- Modales (Certificado y Nombre) -->
    <div id="name-modal" class="hidden fixed inset-0 z-[120] bg-slate-900/90 items-center justify-center p-4">
        <div class="bg-[#151f32] p-8 rounded-2xl max-w-sm w-full text-center">
            <h3 class="text-xl font-bold text-white mb-4">Ingresa tu Nombre Completo</h3>
            <input id="name-input" type="text" class="w-full bg-[#0a0f1a] border border-slate-600 rounded-lg p-3 text-white text-center mb-4" placeholder="Ej. Juan David Pérez">
            <button onclick="confirmName()" class="w-full py-3 bg-amber-600 text-white rounded-lg font-bold">Generar Constancia</button>
        </div>
    </div>

    <div id="certificate-modal" class="hidden fixed inset-0 z-[100] bg-slate-900/95 p-10 items-center justify-center">
        <div class="no-print absolute top-6 right-6 flex gap-4">
            <button onclick="closeCertificate()" class="bg-slate-800 px-5 py-2 rounded-lg">Cerrar</button>
            <button onclick="window.print()" class="bg-amber-600 px-6 py-2 rounded-lg font-bold">Imprimir / PDF</button>
        </div>
        <div id="cert-scaler" class="cert-container text-[#0f172a]">
            <!-- (Contenido del certificado igual al anterior) -->
            <h1 class="cert-font-title text-5xl">CONSTANCIA DE PARTICIPACIÓN</h1>
            <h2 id="cert-student-name" class="text-4xl font-bold text-[#d97706]"></h2>
            <p id="cert-date"></p>
        </div>
    </div>

    <script>
        const lessons = [
            { id: '7-B-JRC58pQ', title: 'Selector Aleatorio' }, { id: 'S6409_LjzcU', title: 'Guías PTA con IA' }, { id: 'g_gbWsoK7IQ', title: 'Guías pedagógicas con IA' },
            { id: '7GWP6n81my8', title: 'Ebooks para colorear' }, { id: 'qukfzI-jyTo', title: 'Libro digital' }, { id: 'afK9LermqzM', title: 'Agenda WhatsApp' },
            { id: 'kgrRb8ZQPNM', title: 'Resúmenes Podcast' }, { id: 'U4uxUGfftkg', title: 'Ingeniería de Prompts' }, { id: 'zFU-ODLcJ4I', title: 'Mapas Conceptuales' },
            { id: '-vmfMEB9nNA', title: 'Infografía 4' }, { id: 'Nvf30k-Kpik', title: 'Infografía 3' }, { id: 'Cbt6oFkI1Uo', title: 'Infografía 2' },
            { id: 'An9keaX12a0', title: 'Infografía 1' }
        ].map(l => ({ ...l, completed: false }));

        let currentIndex = 0;
        let player;

        // Carga de API y Lógica de curso (Resumida para brevedad, mantener lógica del anterior)
        const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', { videoId: lessons[0].id, events: { 'onStateChange': onStateChange } });
            renderPlaylist();
        }

        function markAsCompleted(index) {
            lessons[index].completed = true;
            const progress = (lessons.filter(l => l.completed).length / lessons.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('progress-text').textContent = Math.round(progress) + '%';
        }

        function onStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                markAsCompleted(currentIndex);
                if (lessons.every(l => l.completed)) {
                    document.getElementById('btn-next').style.display = 'none';
                    document.getElementById('btn-cert').style.display = 'flex';
                }
                document.getElementById('end-screen').classList.remove('hidden');
            }
        }

        function playNext() { if (currentIndex < lessons.length - 1) loadLesson(++currentIndex); }
        function loadLesson(i) { currentIndex = i; player.loadVideoById(lessons[i].id); document.getElementById('end-screen').classList.add('hidden'); }
        function renderPlaylist() {
            const container = document.getElementById('playlist');
            lessons.forEach((l, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-3 text-left bg-slate-800 rounded mb-2";
                btn.textContent = l.title;
                btn.onclick = () => loadLesson(i);
                container.appendChild(btn);
            });
        }
        function openNameModal() { document.getElementById('name-modal').classList.remove('hidden'); }
        function confirmName() {
            document.getElementById('cert-student-name').innerText = document.getElementById('name-input').value;
            document.getElementById('cert-date').innerText = new Date().toLocaleDateString();
            document.getElementById('name-modal').classList.add('hidden');
            document.getElementById('certificate-modal').classList.remove('hidden');
        }
        function closeCertificate() { document.getElementById('certificate-modal').classList.add('hidden'); }
        function startVideo() { player.playVideo(); document.getElementById('poster-layer').classList.add('hidden'); }
    </script>
</body>
</html>
