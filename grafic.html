<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Impacto - Pasantía I.E. El Cedro</title>
    
    <!-- 1. Estilos Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. React y ReactDOM (Motor de la UI) - Versiones 18.2.0 -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Prop-types (CRÍTICO: Debe cargarse ANTES de Recharts) -->
    <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

    <!-- 4. Recharts (Librería de Gráficos) - Versión 2.12.0 (Estable para UMD) -->
    <script crossorigin src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <!-- 5. Babel (Para entender JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .card-hover:hover { transform: translateY(-2px); transition: all 0.3s ease; }
    </style>
</head>
<body>

    <!-- Contenedor Raíz -->
    <div id="root"></div>

    <!-- CÓDIGO REACT -->
    <script type="text/babel">
        
        // --- VALIDACIÓN DE DEPENDENCIAS ---
        if (!window.Recharts) {
            document.getElementById('root').innerHTML = '<div class="p-4 text-red-600 font-bold">Error: No se pudo cargar la librería de gráficos (Recharts). Por favor verifique su conexión a internet.</div>';
            throw new Error("Recharts no cargó correctamente.");
        }

        // Desestructuración segura desde el objeto global
        const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, AreaChart, Area } = window.Recharts;

        // Iconos SVG (Inline para evitar dependencias externas)
        const Icons = {
            TrendingUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-teal-600"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            MessageCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-teal-500"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
            Award: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-purple-500"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-teal-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
            AlertTriangle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-orange-500"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        };

        // --- COMPONENTES UI ---
        const StatCard = ({ icon, title, value, desc, trend }) => (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 card-hover">
                <div className="flex justify-between items-start mb-4">
                    <div className="p-3 bg-gray-50 rounded-lg">{icon}</div>
                    {trend === 'up' && <span className="text-green-600 bg-green-50 px-2 py-1 rounded text-xs font-bold flex items-center">↑ Alta</span>}
                    {trend === 'down' && <span className="text-green-600 bg-green-50 px-2 py-1 rounded text-xs font-bold flex items-center">↓ Baja</span>}
                    {trend === 'check' && <span className="text-teal-600 bg-teal-50 px-2 py-1 rounded text-xs font-bold flex items-center">✓ Listo</span>}
                </div>
                <h3 className="text-3xl font-bold text-gray-800 mb-1">{value}</h3>
                <p className="font-semibold text-gray-700">{title}</p>
                <p className="text-xs text-gray-500 mt-1">{desc}</p>
            </div>
        );

        const AchievementItem = ({ title, desc }) => (
            <div className="flex gap-3 items-start p-3 hover:bg-gray-50 rounded-lg transition-colors">
                <div className="mt-1 flex-shrink-0">
                    <Icons.CheckCircle />
                </div>
                <div>
                    <h4 className="font-bold text-gray-800">{title}</h4>
                    <p className="text-sm text-gray-600 leading-relaxed">{desc}</p>
                </div>
            </div>
        );

        // --- DASHBOARD PRINCIPAL ---
        const Dashboard = () => {

            // DATOS 1: EVOLUCIÓN
            const timelineData = [
                { mes: 'Mayo', tension: 90, participacion: 20, confianza: 10, hito: 'Diagnóstico' },
                { mes: 'Junio', tension: 80, participacion: 30, confianza: 25, hito: 'Planeación' },
                { mes: 'Julio', tension: 65, participacion: 45, confianza: 40, hito: 'Inicio Círculos' },
                { mes: 'Ago', tension: 50, participacion: 70, confianza: 60, hito: 'Consolidación' },
                { mes: 'Sep', tension: 30, participacion: 85, confianza: 80, hito: 'Ajustes' },
                { mes: 'Oct', tension: 15, participacion: 95, confianza: 95, hito: 'Socialización' },
            ];

            // DATOS 2: TRANSFORMACIÓN CULTURAL
            const comparativaData = [
                { categoria: 'Expresión Ident.', antes: 20, despues: 90, label: 'Orgullo Afro/Zenú' },
                { categoria: 'Resol. Conflictos', antes: 30, despues: 85, label: 'Uso del Diálogo' },
                { categoria: 'Empatía Grupal', antes: 15, despues: 80, label: 'Reconocimiento' },
                { categoria: 'Valid. Saberes', antes: 10, despues: 95, label: 'Inclusión Currículo' },
            ];

            // DATOS 3: CONFLICTOS
            const conflictoData = [
                { name: 'Diálogo/Mediación', value: 75, color: '#0d9488' },
                { name: 'Sanción Punitiva', value: 15, color: '#f59e0b' },
                { name: 'Silencio/Evasión', value: 10, color: '#ef4444' },
            ];

            return (
                <div className="min-h-screen bg-gray-50 p-6 font-sans">
                
                {/* ENCABEZADO */}
                <div className="mb-8 max-w-7xl mx-auto">
                    <h1 className="text-3xl font-bold text-gray-800 flex items-center gap-3">
                    <Icons.TrendingUp />
                    Tablero de Impacto: Pasantía I.E. El Cedro
                    </h1>
                    <p className="text-gray-600 mt-2 ml-1">
                    Visualización de logros basada en la sistematización de la experiencia "Círculos de Diálogo Intercultural".
                    </p>
                </div>

                <div className="max-w-7xl mx-auto">
                    {/* TARJETAS DE RESUMEN (KPIs) */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <StatCard 
                            icon={<Icons.Users />}
                            title="Participación"
                            value="95%"
                            desc="De los estudiantes activos en la fase final"
                            trend="up"
                        />
                        <StatCard 
                            icon={<Icons.MessageCircle />}
                            title="Clima de Aula"
                            value="+80%"
                            desc="Mejora en percepción de seguridad"
                            trend="up"
                        />
                        <StatCard 
                            icon={<Icons.AlertTriangle />}
                            title="Violencia Simbólica"
                            value="-70%"
                            desc="Reducción de burlas por acento/origen"
                            trend="down"
                        />
                        <StatCard 
                            icon={<Icons.Award />}
                            title="Sostenibilidad"
                            value="PEI 2026"
                            desc="Estrategia institucionalizada"
                            trend="check"
                        />
                    </div>

                    {/* GRÁFICOS PRINCIPALES */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                    
                        {/* GRÁFICO 1: EVOLUCIÓN MENSUAL */}
                        <div className="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                            <h3 className="text-xl font-bold text-gray-800 mb-1">Evolución de la Convivencia</h3>
                            <p className="text-sm text-gray-500 mb-6">Mayo a Octubre 2025: Cruce de variables clave</p>
                            <div className="h-72">
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={timelineData} margin={{ top: 10, right: 30, left: 0, bottom: 0 }}>
                                <defs>
                                    <linearGradient id="colorPart" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor="#0d9488" stopOpacity={0.8}/>
                                    <stop offset="95%" stopColor="#0d9488" stopOpacity={0}/>
                                    </linearGradient>
                                    <linearGradient id="colorConf" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.8}/>
                                    <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                    </linearGradient>
                                </defs>
                                <XAxis dataKey="mes" />
                                <YAxis />
                                <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                <Tooltip contentStyle={{ borderRadius: '10px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                                <Legend />
                                <Area type="monotone" dataKey="participacion" name="Participación Activa" stroke="#0d9488" fillOpacity={1} fill="url(#colorPart)" />
                                <Area type="monotone" dataKey="confianza" name="Nivel de Confianza" stroke="#3b82f6" fillOpacity={1} fill="url(#colorConf)" />
                                <Line type="monotone" dataKey="tension" name="Tensiones/Conflictos" stroke="#ef4444" strokeWidth={3} dot={{ r: 4 }} />
                                </AreaChart>
                            </ResponsiveContainer>
                            </div>
                            <div className="mt-4 text-xs text-gray-500 italic bg-gray-50 p-3 rounded-lg border-l-4 border-teal-500">
                            <strong>Análisis:</strong> Se observa una correlación inversa clara. A medida que se consolidaron los círculos (Julio-Agosto), la confianza aumentó y las tensiones disminuyeron drásticamente.
                            </div>
                        </div>

                        {/* GRÁFICO 2: ANTES VS DESPUÉS */}
                        <div className="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                            <h3 className="text-xl font-bold text-gray-800 mb-1">Impacto Cualitativo</h3>
                            <p className="text-sm text-gray-500 mb-6">Comparativa de indicadores pre y post intervención</p>
                            <div className="h-72">
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={comparativaData} layout="vertical" margin={{ top: 5, right: 30, left: 40, bottom: 5 }}>
                                <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} />
                                <XAxis type="number" domain={[0, 100]} hide />
                                <YAxis dataKey="categoria" type="category" width={100} tick={{fontSize: 11}} />
                                <Tooltip cursor={{fill: 'transparent'}} />
                                <Legend />
                                <Bar dataKey="antes" name="Inicio (Diag.)" fill="#cbd5e1" radius={[0, 4, 4, 0]} barSize={20} />
                                <Bar dataKey="despues" name="Cierre (Resul.)" fill="#0d9488" radius={[0, 4, 4, 0]} barSize={20} />
                                </BarChart>
                            </ResponsiveContainer>
                            </div>
                            <div className="mt-4 text-xs text-gray-500 italic bg-gray-50 p-3 rounded-lg border-l-4 border-teal-500">
                            <strong>Logro clave:</strong> El mayor impacto se dio en la "Validación de Saberes", pasando de un currículo excluyente a uno que integra la memoria local.
                            </div>
                        </div>

                    </div>

                    {/* SECCIÓN INFERIOR: GRÁFICO PIE Y LISTA DE LOGROS */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 pb-10">
                    
                        {/* GRÁFICO 3: GESTIÓN DEL CONFLICTO */}
                        <div className="bg-white p-6 rounded-2xl shadow-md border border-gray-100 md:col-span-1">
                            <h3 className="text-lg font-bold text-gray-800 mb-4 text-center">Gestión del Conflicto</h3>
                            <div className="h-64">
                            <ResponsiveContainer width="100%" height="100%">
                                <PieChart>
                                <Pie
                                    data={conflictoData}
                                    cx="50%"
                                    cy="50%"
                                    innerRadius={60}
                                    outerRadius={80}
                                    paddingAngle={5}
                                    dataKey="value"
                                >
                                    {conflictoData.map((entry, index) => (
                                    <Cell key={`cell-${index}`} fill={entry.color} />
                                    ))}
                                </Pie>
                                <Tooltip />
                                <Legend verticalAlign="bottom" height={36}/>
                                </PieChart>
                            </ResponsiveContainer>
                            </div>
                            <p className="text-center text-sm text-gray-600 mt-2">
                            Predominio del diálogo (75%) frente a lo punitivo.
                            </p>
                        </div>

                        {/* LISTA DE LOGROS CONSOLIDADOS */}
                        <div className="bg-white p-6 rounded-2xl shadow-md border border-gray-100 md:col-span-2">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Logros Consolidados</h3>
                            <div className="space-y-4">
                            <AchievementItem 
                                title="Ruptura de Jerarquías" 
                                desc="Se eliminó la disposición en filas, logrando que la palabra del estudiante tenga el mismo valor espacial que la del docente."
                            />
                            <AchievementItem 
                                title="Traducción Cultural" 
                                desc="Docentes capacitados para entender que el 'tono alto' afro no es grito, y el 'silencio' Zenú no es ignorancia."
                            />
                            <AchievementItem 
                                title="Institucionalización (PEI 2026)" 
                                desc="La estrategia dejó de ser una actividad de pasantía para convertirse en política institucional (Gestión de Comunidad)."
                            />
                            <AchievementItem 
                                title="Reparación del Tejido Social" 
                                desc="Los círculos permitieron procesar traumas del conflicto armado (desplazamiento) sin revictimizar."
                            />
                            </div>
                        </div>

                    </div>
                </div>
                </div>
            );
        };

        // --- 3. RENDERIZADO EN EL DOM ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
