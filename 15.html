<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Espina de Pescado - Ishikawa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .input-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .category-input {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .category-input input {
            margin-bottom: 10px;
        }

        .cause-list {
            margin-top: 10px;
        }

        .cause-item {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .cause-item input {
            flex: 1;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-small {
            padding: 6px 15px;
            font-size: 0.9em;
        }

        .btn-remove {
            background: #e74c3c;
            padding: 6px 12px;
        }

        .diagram-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: auto;
        }

        #fishboneCanvas {
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }

        .actions {
            text-align: center;
            margin-top: 20px;
        }

        .color-picker {
            display: inline-block;
            margin-left: 10px;
        }

        .helper-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐟 Diagrama de Espina de Pescado (Ishikawa)</h1>
        
        <div class="input-section">
            <div class="form-group">
                <label>Problema Principal (Cabeza del Pescado):</label>
                <input type="text" id="mainProblem" placeholder="Ej: Baja calidad del producto" value="Defectos en el Producto Final">
                <div class="helper-text">Este será el efecto o problema que quieres analizar</div>
            </div>

            <div class="form-group">
                <label>Categorías y Causas:</label>
                <div class="helper-text" style="margin-bottom: 15px">Agrega categorías principales y sus causas específicas</div>
                <div class="categories-grid" id="categoriesContainer">
                    <!-- Se generarán dinámicamente -->
                </div>
                <button class="btn btn-small" onclick="addCategory()">+ Agregar Categoría</button>
            </div>

            <div class="actions">
                <button class="btn" onclick="generateDiagram()">🎨 Generar Diagrama</button>
                <button class="btn" onclick="downloadDiagram()">💾 Descargar Imagen</button>
            </div>
        </div>

        <div class="diagram-container">
            <canvas id="fishboneCanvas"></canvas>
        </div>
    </div>

    <script>
        let categories = [
            { name: 'Métodos', causes: ['Proceso inadecuado', 'Falta de estándares'] },
            { name: 'Máquinas', causes: ['Equipo obsoleto', 'Falta de mantenimiento'] },
            { name: 'Materiales', causes: ['Materia prima deficiente', 'Almacenamiento incorrecto'] },
            { name: 'Mano de Obra', causes: ['Falta de capacitación', 'Alta rotación'] },
            { name: 'Medición', causes: ['Instrumentos descalibrados', 'Métodos imprecisos'] },
            { name: 'Medio Ambiente', causes: ['Temperatura inadecuada', 'Humedad excesiva'] }
        ];

        function renderCategoryInputs() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';
            
            categories.forEach((cat, catIndex) => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category-input';
                
                let causesHTML = '';
                cat.causes.forEach((cause, causeIndex) => {
                    causesHTML += `
                        <div class="cause-item">
                            <input type="text" value="${cause}" 
                                onchange="updateCause(${catIndex}, ${causeIndex}, this.value)">
                            <button class="btn btn-small btn-remove" 
                                onclick="removeCause(${catIndex}, ${causeIndex})">✕</button>
                        </div>
                    `;
                });
                
                catDiv.innerHTML = `
                    <input type="text" value="${cat.name}" 
                        onchange="updateCategoryName(${catIndex}, this.value)"
                        style="font-weight: 600; background: white;">
                    <div class="cause-list">
                        ${causesHTML}
                    </div>
                    <button class="btn btn-small" onclick="addCause(${catIndex})">+ Causa</button>
                    <button class="btn btn-small btn-remove" onclick="removeCategory(${catIndex})">Eliminar Categoría</button>
                `;
                
                container.appendChild(catDiv);
            });
        }

        function addCategory() {
            categories.push({ name: 'Nueva Categoría', causes: ['Causa 1'] });
            renderCategoryInputs();
        }

        function removeCategory(index) {
            if (categories.length > 1) {
                categories.splice(index, 1);
                renderCategoryInputs();
            }
        }

        function addCause(catIndex) {
            categories[catIndex].causes.push('Nueva causa');
            renderCategoryInputs();
        }

        function removeCause(catIndex, causeIndex) {
            if (categories[catIndex].causes.length > 1) {
                categories[catIndex].causes.splice(causeIndex, 1);
                renderCategoryInputs();
            }
        }

        function updateCategoryName(index, value) {
            categories[index].name = value;
        }

        function updateCause(catIndex, causeIndex, value) {
            categories[catIndex].causes[causeIndex] = value;
        }

        function generateDiagram() {
            const canvas = document.getElementById('fishboneCanvas');
            const ctx = canvas.getContext('2d');
            const problem = document.getElementById('mainProblem').value;
            
            // Configurar tamaño del canvas
            const width = 1200;
            const height = 800;
            canvas.width = width;
            canvas.height = height;
            
            // Limpiar canvas
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            // Colores
            const spineColor = '#2c3e50';
            const boneColor = '#34495e';
            const categoryColor = '#e74c3c';
            const causeColor = '#3498db';
            const headColor = '#e67e22';
            
            // Dimensiones
            const headX = width - 100;
            const headY = height / 2;
            const spineStartX = 100;
            const spineEndX = headX - 120;
            const spineY = height / 2;
            
            // Dibujar espina principal (cuerpo del pescado)
            ctx.beginPath();
            ctx.strokeStyle = spineColor;
            ctx.lineWidth = 4;
            ctx.moveTo(spineStartX, spineY);
            ctx.lineTo(spineEndX, spineY);
            ctx.stroke();
            
            // Dibujar cabeza del pescado (problema principal)
            drawFishHead(ctx, headX, headY, problem, headColor);
            
            // Calcular posiciones para las categorías
            const numCategories = categories.length;
            const topCategories = categories.filter((_, i) => i % 2 === 0);
            const bottomCategories = categories.filter((_, i) => i % 2 === 1);
            
            // Dibujar categorías superiores
            const topSpacing = (spineEndX - spineStartX) / (topCategories.length + 1);
            topCategories.forEach((cat, i) => {
                const x = spineStartX + topSpacing * (i + 1);
                const y = spineY - 150;
                drawBone(ctx, x, spineY, x, y, cat, true, boneColor, categoryColor, causeColor);
            });
            
            // Dibujar categorías inferiores
            const bottomSpacing = (spineEndX - spineStartX) / (bottomCategories.length + 1);
            bottomCategories.forEach((cat, i) => {
                const x = spineStartX + bottomSpacing * (i + 1);
                const y = spineY + 150;
                drawBone(ctx, x, spineY, x, y, cat, false, boneColor, categoryColor, causeColor);
            });
            
            // Dibujar cola del pescado
            drawFishTail(ctx, spineStartX, spineY, spineColor);
        }

        function drawFishHead(ctx, x, y, text, color) {
            // Forma de cabeza de pescado
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.ellipse(x, y, 80, 60, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Ojo del pescado
            ctx.beginPath();
            ctx.fillStyle = 'white';
            ctx.arc(x - 20, y - 15, 12, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.fillStyle = '#2c3e50';
            ctx.arc(x - 18, y - 15, 6, 0, 2 * Math.PI);
            ctx.fill();
            
            // Boca
            ctx.beginPath();
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.arc(x + 50, y, 15, 0.2 * Math.PI, 1.8 * Math.PI);
            ctx.stroke();
            
            // Texto del problema
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            wrapText(ctx, text, x, y + 10, 140, 18);
        }

        function drawFishTail(ctx, x, y, color) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.fillStyle = '#95a5a6';
            
            // Aleta superior
            ctx.moveTo(x, y);
            ctx.lineTo(x - 50, y - 60);
            ctx.lineTo(x - 20, y - 20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Aleta inferior
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 50, y + 60);
            ctx.lineTo(x - 20, y + 20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function drawBone(ctx, startX, startY, endX, endY, category, isTop, boneColor, categoryColor, causeColor) {
            // Dibujar hueso principal
            ctx.beginPath();
            ctx.strokeStyle = boneColor;
            ctx.lineWidth = 3;
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            
            // Dibujar nombre de categoría
            ctx.fillStyle = categoryColor;
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = isTop ? 'bottom' : 'top';
            ctx.fillText(category.name, endX, isTop ? endY - 10 : endY + 10);
            
            // Dibujar causas
            const numCauses = category.causes.length;
            const spacing = 100 / (numCauses + 1);
            
            category.causes.forEach((cause, i) => {
                const progress = (i + 1) / (numCauses + 1);
                const causeX = startX + (endX - startX) * progress;
                const causeY = startY + (endY - startY) * progress;
                
                // Mini hueso para la causa
                const offset = isTop ? -40 : 40;
                const causeEndY = causeY + offset;
                
                ctx.beginPath();
                ctx.strokeStyle = causeColor;
                ctx.lineWidth = 2;
                ctx.moveTo(causeX, causeY);
                ctx.lineTo(causeX, causeEndY);
                ctx.stroke();
                
                // Texto de la causa
                ctx.fillStyle = '#2c3e50';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = isTop ? 'bottom' : 'top';
                wrapText(ctx, cause, causeX, isTop ? causeEndY - 5 : causeEndY + 5, 80, 14);
            });
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lines = [];
            
            words.forEach(word => {
                const testLine = line + word + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && line !== '') {
                    lines.push(line);
                    line = word + ' ';
                } else {
                    line = testLine;
                }
            });
            lines.push(line);
            
            const startY = y - ((lines.length - 1) * lineHeight) / 2;
            lines.forEach((line, i) => {
                ctx.fillText(line.trim(), x, startY + i * lineHeight);
            });
        }

        function downloadDiagram() {
            const canvas = document.getElementById('fishboneCanvas');
            const link = document.createElement('a');
            link.download = 'diagrama-ishikawa.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Inicializar
        renderCategoryInputs();
        generateDiagram();
    </script>
</body>
</html>
