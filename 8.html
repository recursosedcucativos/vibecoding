<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Interactivo con Efectos Superpuestos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor-principal {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        /* SECCIÓN DEL VIDEO */
        .seccion-video {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            padding: 40px;
            position: relative;
        }

        .area-video {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .area-video video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* CONTENEDOR FLOTANTE DE EFECTOS - SOBRE EL VIDEO */
        .contenedor-efectos-flotantes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 10px;
        }

        .efecto-flotante {
            position: absolute;
            font-size: 80px;
            animation: flota 2s ease-out forwards;
            user-select: none;
        }

        @keyframes flota {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8) rotate(0deg);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.2) rotate(10deg);
            }
        }

        .zona-carga {
            text-align: center;
            color: #999;
        }

        .zona-carga svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .zona-carga p {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .input-archivo {
            display: none;
        }

        .btn-cargar-video {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-cargar-video:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-cargar-video:active {
            transform: translateY(-1px);
        }

        .nombre-video {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
        }

        /* SECCIÓN DE CONTROLES */
        .seccion-controles {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .seccion-controles h2 {
            color: #667eea;
            font-size: 22px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* CONTENEDOR DE VISTA PREVIA DE GIFs */
        .contenedor-preview-gifs {
            background: rgba(102, 126, 234, 0.05);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            border: 2px dashed #667eea;
            text-align: center;
        }

        .preview-gif {
            font-size: 60px;
            animation: bounce 0.6s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .preview-label {
            color: #999;
            font-size: 12px;
            position: absolute;
            bottom: 5px;
        }

        /* BOTONES */
        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-efecto {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-efecto::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-efecto:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-aplausos {
            background: linear-gradient(135deg, #ff6b6b, #ff8e72);
            color: white;
        }

        .btn-aplausos:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-risa {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        .btn-risa:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-campana {
            background: linear-gradient(135deg, #fa709a, #fee140);
            color: white;
        }

        .btn-campana:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(250, 112, 154, 0.4);
        }

        .btn-fuego {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
        }

        .btn-fuego:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 126, 95, 0.4);
        }

        .btn-estrella {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-estrella:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-corazon {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-corazon:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-lluvia {
            background: linear-gradient(135deg, #12c2e9, #c471ed);
            color: white;
        }

        .btn-lluvia:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(18, 194, 233, 0.4);
        }

        .btn-confeti {
            background: linear-gradient(135deg, #fa709a, #ff9a56);
            color: white;
        }

        .btn-confeti:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(250, 112, 154, 0.4);
        }

        .btn-limpiar {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #8e8e8e, #585858);
            color: white;
            font-size: 12px;
        }

        .btn-limpiar:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* AUDIO INVISIBLE */
        audio {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .contenedor-principal {
                grid-template-columns: 1fr;
                height: auto;
                gap: 15px;
            }

            .seccion-video {
                min-height: 300px;
            }

            .grid-botones {
                grid-template-columns: 1fr;
            }

            .nombre-video {
                max-width: 200px;
            }

            .efecto-flotante {
                font-size: 60px;
            }
        }

        .contador-efectos {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 10px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <!-- SECCIÓN DEL VIDEO -->
        <div class="seccion-video">
            <div id="nombre-video-mostrado" class="nombre-video" style="display: none;"></div>
            
            <div class="area-video">
                <div id="zona-carga" class="zona-carga">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 7l-7 5 7 5V7z"></path>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                    <p>No hay video cargado</p>
                    <button class="btn-cargar-video" onclick="document.getElementById('input-video').click()">
                        📁 Cargar Video
                    </button>
                    <input 
                        type="file" 
                        id="input-video" 
                        class="input-archivo" 
                        accept="video/*"
                        onchange="cargarVideo(event)"
                    >
                </div>
                <video id="mi-video" controls style="display: none;"></video>
                
                <!-- CONTENEDOR DE EFECTOS FLOTANTES SOBRE EL VIDEO -->
                <div class="contenedor-efectos-flotantes" id="contenedor-efectos"></div>
            </div>
        </div>

        <!-- SECCIÓN DE CONTROLES -->
        <div class="seccion-controles">
            <h2>🎉 Efectos en Vivo</h2>

            <!-- VISTA PREVIA DEL SIGUIENTE EFECTO -->
            <div class="contenedor-preview-gifs" id="preview-efectos">
                <div style="position: relative; display: flex; align-items: center; justify-content: center; height: 100%;">
                    <span class="preview-gif">👇</span>
                    <span class="preview-label">Haz clic en un botón</span>
                </div>
            </div>

            <!-- BOTONES DE EFECTOS -->
            <div class="grid-botones">
                <button class="btn-efecto btn-aplausos" onclick="activarEfecto('aplausos', '👏')">
                    Aplausos 👏
                </button>
                <button class="btn-efecto btn-risa" onclick="activarEfecto('risa', '😂')">
                    Risa 😂
                </button>
                <button class="btn-efecto btn-campana" onclick="activarEfecto('campana', '🔔')">
                    Campana 🔔
                </button>
                <button class="btn-efecto btn-fuego" onclick="activarEfecto('fuego', '🔥')">
                    Fuego 🔥
                </button>
                <button class="btn-efecto btn-estrella" onclick="activarEfecto('estrella', '⭐')">
                    Estrella ⭐
                </button>
                <button class="btn-efecto btn-corazon" onclick="activarEfecto('corazon', '❤️')">
                    Corazón ❤️
                </button>
                <button class="btn-efecto btn-lluvia" onclick="activarEfecto('lluvia', '🌧️')">
                    Lluvia 🌧️
                </button>
                <button class="btn-efecto btn-confeti" onclick="document.getElementById('input-animacion').click()">
                    📤 Cargar Anim
                </button>
            </div>

            <input 
                type="file" 
                id="input-animacion" 
                class="input-archivo" 
                accept="image/*,video/*"
                onchange="cargarAnimacionPersonalizada(event)"
            >

            <button class="btn-efecto btn-limpiar" onclick="limpiarEfectos()">
                🧹 Limpiar Efectos
            </button>

            <div class="contador-efectos" id="contador">
                Efectos activados: 0
            </div>
        </div>
    </div>

    <!-- AUDIOS INVISIBLES -->
    <audio id="sonido-aplausos">
        <source src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sonido-risa">
        <source src="https://assets.mixkit.co/active_storage/sfx/2674/2674-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sonido-campana">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sonido-fuego">
        <source src="https://assets.mixkit.co/active_storage/sfx/2100/2100-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sonido-estrella">
        <source src="https://assets.mixkit.co/active_storage/sfx/2875/2875-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sonido-corazon">
        <source src="https://assets.mixkit.co/active_storage/sfx/2799/2799-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sonido-lluvia">
        <source src="https://assets.mixkit.co/active_storage/sfx/2954/2954-preview.mp3" type="audio/mpeg">
    </audio>


    <script>
        let contadorEfectos = 0;

        const emojis = {
            aplausos: '👏',
            risa: '😂',
            campana: '🔔',
            fuego: '🔥',
            estrella: '⭐',
            corazon: '❤️',
            lluvia: '🌧️'
        };

        let animacionPersonalizada = null;

        function cargarVideo(event) {
            const archivo = event.target.files[0];
            
            if (!archivo) return;

            if (!archivo.type.startsWith('video/')) {
                alert('Por favor selecciona un archivo de video válido');
                return;
            }

            const urlVideo = URL.createObjectURL(archivo);
            const video = document.getElementById('mi-video');
            const zonaCarga = document.getElementById('zona-carga');
            const nombreVideoMostrado = document.getElementById('nombre-video-mostrado');

            video.src = urlVideo;
            video.style.display = 'block';
            zonaCarga.style.display = 'none';

            nombreVideoMostrado.textContent = `📹 ${archivo.name}`;
            nombreVideoMostrado.style.display = 'block';
        }

        function activarEfecto(tipo, emoji) {
            // Reproducir sonido
            const sonido = document.getElementById(`sonido-${tipo}`);
            sonido.currentTime = 0;
            sonido.play().catch(e => console.log('Sonido no disponible'));

            // Actualizar preview
            const preview = document.getElementById('preview-efectos');
            preview.innerHTML = `
                <div style="position: relative; display: flex; align-items: center; justify-content: center; height: 100%;">
                    <span class="preview-gif" style="animation: bounce 0.6s ease-in-out infinite;">${emoji}</span>
                </div>
            `;

            // Crear múltiples efectos flotantes
            const areaVideo = document.querySelector('.area-video');
            const contenedor = document.getElementById('contenedor-efectos');

            // Generar 3-5 efectos en posiciones aleatorias
            const cantidadEfectos = Math.random() > 0.5 ? 4 : 3;
            
            for (let i = 0; i < cantidadEfectos; i++) {
                setTimeout(() => {
                    crearEfectoFlotante(emoji, contenedor);
                }, i * 150);
            }

            contadorEfectos++;
            actualizarContador();
        }

        function crearEfectoFlotante(emoji, contenedor) {
            const efecto = document.createElement('div');
            efecto.className = 'efecto-flotante';
            efecto.textContent = emoji;

            // Posición aleatoria horizontal
            const posX = Math.random() * 80 + 10; // 10% a 90%
            const posY = Math.random() * 60 + 20; // 20% a 80%

            efecto.style.left = posX + '%';
            efecto.style.top = posY + '%';

            contenedor.appendChild(efecto);

            // Remover después de la animación
            setTimeout(() => {
                efecto.remove();
            }, 2000);
        }

        function limpiarEfectos() {
            const contenedor = document.getElementById('contenedor-efectos');
            contenedor.innerHTML = '';
            contadorEfectos = 0;
            actualizarContador();

            const preview = document.getElementById('preview-efectos');
            preview.innerHTML = `
                <div style="position: relative; display: flex; align-items: center; justify-content: center; height: 100%;">
                    <span class="preview-gif">👇</span>
                    <span class="preview-label">Haz clic en un botón</span>
                </div>
            `;
        }

        function actualizarContador() {
            document.getElementById('contador').textContent = `Efectos activados: ${contadorEfectos}`;
        }

        function cargarAnimacionPersonalizada(event) {
            const archivo = event.target.files[0];
            
            if (!archivo) return;

            if (!archivo.type.startsWith('image/') && !archivo.type.startsWith('video/')) {
                alert('Por favor selecciona una imagen GIF o video válido');
                return;
            }

            // Crear URL del archivo
            const urlArchivo = URL.createObjectURL(archivo);
            
            // Guardar información de la animación personalizada
            animacionPersonalizada = {
                url: urlArchivo,
                tipo: archivo.type.startsWith('image/') ? 'imagen' : 'video',
                nombre: archivo.name
            };

            // Actualizar preview
            const preview = document.getElementById('preview-efectos');
            if (animacionPersonalizada.tipo === 'imagen') {
                preview.innerHTML = `<img src="${urlArchivo}" style="max-width: 100%; max-height: 100%; border-radius: 8px;">`;
            } else {
                preview.innerHTML = `<video src="${urlArchivo}" style="max-width: 100%; max-height: 100%; border-radius: 8px;" autoplay muted></video>`;
            }

            console.log('Animación personalizada cargada:', archivo.name);

            // Activar automáticamente la animación
            setTimeout(() => {
                activarAnimacionPersonalizadaDirecta();
            }, 300);

            // Reabrir el input para poder cargar otra vez
            event.target.value = '';
        }

        function activarAnimacionPersonalizadaDirecta() {
            if (!animacionPersonalizada) {
                return;
            }

            const areaVideo = document.querySelector('.area-video');
            const contenedor = document.getElementById('contenedor-efectos');

            // Generar 2-3 efectos de la animación personalizada
            const cantidadEfectos = Math.random() > 0.4 ? 3 : 2;
            
            for (let i = 0; i < cantidadEfectos; i++) {
                setTimeout(() => {
                    crearEfectoPersonalizado(contenedor);
                }, i * 200);
            }

            contadorEfectos++;
            actualizarContador();
        }

        function crearEfectoPersonalizado(contenedor) {
            const efecto = document.createElement('div');
            efecto.className = 'efecto-flotante';
            efecto.style.fontSize = 'unset';

            // Crear elemento imagen o video
            if (animacionPersonalizada.tipo === 'imagen') {
                const img = document.createElement('img');
                img.src = animacionPersonalizada.url;
                img.style.width = '100px';
                img.style.height = '100px';
                img.style.objectFit = 'contain';
                img.style.borderRadius = '8px';
                efecto.appendChild(img);
            } else {
                const video = document.createElement('video');
                video.src = animacionPersonalizada.url;
                video.style.width = '100px';
                video.style.height = '100px';
                video.style.objectFit = 'contain';
                video.style.borderRadius = '8px';
                video.autoplay = true;
                video.muted = true;
                video.loop = false;
                efecto.appendChild(video);
            }

            // Posición aleatoria horizontal
            const posX = Math.random() * 80 + 10;
            const posY = Math.random() * 60 + 20;

            efecto.style.left = posX + '%';
            efecto.style.top = posY + '%';

            contenedor.appendChild(efecto);

            // Remover después de la animación
            setTimeout(() => {
                efecto.remove();
            }, 2000);
        }
    </script>

</body>
</html>
