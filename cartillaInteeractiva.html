<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartilla Intercultural - I.E. El Cedro</title>
    
    <!-- Tailwind CSS (Estilos modernos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Estilos Personalizados y Animaciones -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Animaciones personalizadas equivalentes a las de React */
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
        .animate-bounce-slow { animation: bounce 3s infinite; }
        .animate-spin-slow { animation: spin 8s linear infinite; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounce { 
            0%, 100% { transform: translateY(-5%); } 
            50% { transform: translateY(0); } 
        }

        /* Utilidad para ocultar scrollbar pero permitir scroll si es necesario */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="h-screen bg-gray-50 text-gray-800 overflow-hidden relative selection:bg-teal-200">

    <!-- NAVIGATION BAR -->
    <nav class="fixed top-0 left-0 w-full bg-white/90 backdrop-blur-md shadow-sm z-50 h-16 flex items-center justify-between px-4 md:px-8">
        <div class="flex items-center gap-2 text-teal-700 font-bold text-lg cursor-pointer" onclick="goToPage(0)">
            <i data-lucide="book-open" class="w-6 h-6"></i>
            <span class="hidden md:inline">Cartilla Intercultural</span>
        </div>
        
        <div class="flex items-center gap-4">
            <span id="page-indicator" class="text-sm text-gray-500 font-medium hidden md:block">
                <!-- Se llena con JS -->
            </span>
            
            <button onclick="toggleMenu()" class="p-2 hover:bg-teal-50 rounded-full transition-colors text-teal-700">
                <i id="menu-icon" data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
    </nav>

    <!-- MOBILE MENU OVERLAY -->
    <div id="mobile-menu" class="fixed inset-0 bg-teal-900/95 z-40 flex-col justify-center items-center backdrop-blur-sm animate-fade-in hidden">
        <div class="flex flex-col gap-4 w-full max-w-xs" id="menu-items">
            <!-- Items generados por JS -->
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <!-- MODIFICADO: h-screen y scroll interno para mejor ajuste en ventana -->
    <main class="h-screen w-full pt-20 pb-24 px-4 overflow-y-auto bg-gradient-to-br from-gray-50 to-teal-50/30 scroll-smooth">
        <!-- Contenedor interno con min-h-full para centrado vertical seguro -->
        <div id="app-content" class="w-full max-w-6xl mx-auto min-h-full flex flex-col justify-center transition-all duration-500 ease-in-out">
            <!-- El contenido de las páginas se inyecta aquí -->
        </div>
    </main>

    <!-- FOOTER CONTROLS -->
    <footer class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 z-30 flex justify-between items-center px-4 md:px-12">
        <button id="btn-prev" onclick="prevPage()" class="flex items-center gap-2 px-6 py-2 rounded-full font-bold transition-all bg-gray-100 hover:bg-teal-100 text-teal-800 hover:shadow-md">
            <i data-lucide="chevron-left" class="w-5 h-5"></i> Anterior
        </button>

        <div id="progress-dots" class="flex gap-2">
            <!-- Puntos generados por JS -->
        </div>

        <button id="btn-next" onclick="nextPage()" class="flex items-center gap-2 px-6 py-2 rounded-full font-bold transition-all bg-teal-600 hover:bg-teal-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-1">
            Siguiente <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- DATA ---
        const projectInfo = {
            title: "Caja de Herramientas Interculturales",
            subtitle: "Del Aula a la Institución: Estrategias para la Convivencia",
            authors: ["Ever de Jesús Reyes Sánchez"], // MODIFICADO: Eliminado Elías José Torres Brunal
            institution: "Institución Educativa El Cedro",
            location: "Ayapel, Córdoba",
            year: "2026"
        };

        const pages = [
            { id: 'cover', title: 'Portada' },
            { id: 'context', title: 'Contexto: Ayapel' },
            { id: 'problem', title: 'El Desafío' },
            { id: 'solution', title: 'La Solución: Círculos' },
            { id: 'tools', title: 'Herramientas Prácticas' },
            { id: 'teacher', title: 'Guía Docente' },
            { id: 'credits', title: 'Créditos' }
        ];

        const toolsData = [
            {
                id: 1,
                title: "El Bastón de la Palabra",
                icon: "message-circle",
                color: "bg-orange-500",
                content: "Un objeto físico (puede ser artesanal) que otorga el turno. En la cultura indígena representa autoridad y respeto. Quien lo tiene, es escuchado sin interrupciones."
            },
            {
                id: 2,
                title: "Relatos de la Tierra",
                icon: "book-open",
                color: "bg-emerald-600",
                content: "Actividad donde los estudiantes traen una historia de sus abuelos sobre el campo, la pesca o el conflicto. Valida el saber familiar dentro de la escuela."
            },
            {
                id: 3,
                title: "Mapa de Emociones",
                icon: "heart",
                color: "bg-rose-500",
                content: "Herramienta visual para señalar cómo nos sentimos hoy. Es vital para estudiantes que han sufrido traumas o desplazamiento y les cuesta verbalizar."
            }
        ];

        const tipsData = [
            { title: "El Docente como Traductor", text: "No juzgues el comportamiento 'diferente' como indisciplina. Pregúntate: ¿Qué significa este gesto en su cultura?" },
            { title: "Institucionalizar en el PEI", text: "Si el profe se va, la estrategia muere. Es vital incluir los círculos en el cronograma oficial de convivencia escolar." },
            { title: "Involucrar a las Familias", text: "La escuela no puede ser una isla. Invita a los abuelos y padres a contar historias en el aula. Eso reduce la violencia simbólica." },
            { title: "Manejo del Trauma", text: "En zonas de posconflicto, evita revictimizar. El círculo es para sanar y escuchar, no para interrogar." }
        ];

        // --- STATE ---
        let currentPage = 0;
        let isMenuOpen = false;
        let activeToolId = null;

        // --- FUNCTIONS ---

        function init() {
            render();
        }

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            
            if (isMenuOpen) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
                icon.setAttribute('data-lucide', 'x');
                renderMenu();
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                icon.setAttribute('data-lucide', 'menu');
            }
            lucide.createIcons();
        }

        function renderMenu() {
            const container = document.getElementById('menu-items');
            container.innerHTML = pages.map((page, idx) => `
                <button onclick="goToPage(${idx})"
                    class="p-4 rounded-xl text-lg font-semibold transition-all transform hover:scale-105 w-full text-center ${
                        currentPage === idx 
                        ? 'bg-white text-teal-800 shadow-lg' 
                        : 'bg-teal-800/50 text-white hover:bg-teal-700'
                    }">
                    ${page.title}
                </button>
            `).join('');
        }

        function goToPage(index) {
            currentPage = index;
            if (isMenuOpen) toggleMenu();
            render();
        }

        function nextPage() {
            if (currentPage < pages.length - 1) {
                currentPage++;
                render();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                render();
            }
        }

        function toggleTool(id) {
            activeToolId = (activeToolId === id) ? null : id;
            renderToolsPage();
            render();
        }

        // --- RENDERERS FOR EACH PAGE ---

        function getCoverPageHTML() {
            return `
            <div class="flex flex-col items-center text-center animate-slide-up py-8">
                <div class="mb-6 p-4 bg-white rounded-full shadow-2xl shadow-teal-100 border-4 border-teal-50">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Escudo_de_Ayapel.svg/1200px-Escudo_de_Ayapel.svg.png" 
                        alt="Logo Contexto" class="w-24 h-24 md:w-32 md:h-32 object-contain opacity-80" onerror="this.style.display='none'">
                </div>
                
                <h3 class="text-teal-600 font-bold tracking-widest uppercase mb-2 text-sm md:text-base">Maestría en Educación</h3>
                <h1 class="text-3xl md:text-6xl font-extrabold text-gray-900 mb-4 leading-tight bg-clip-text text-transparent bg-gradient-to-r from-teal-600 to-emerald-600 px-2">
                    ${projectInfo.title}
                </h1>
                <h2 class="text-lg md:text-2xl text-gray-600 max-w-2xl mb-8 font-light px-4">
                    ${projectInfo.subtitle}
                </h2>

                <div class="bg-white p-6 rounded-2xl shadow-xl max-w-lg w-11/12 md:w-full mb-10 border border-gray-100 transform hover:scale-105 transition-transform duration-300">
                    <p class="text-sm text-gray-400 uppercase font-bold mb-2">Autor</p>
                    ${projectInfo.authors.map(a => `<p class="text-lg font-medium text-gray-800 border-b last:border-0 border-gray-100 py-1">${a}</p>`).join('')}
                    <p class="mt-4 text-sm text-teal-600 font-semibold">${projectInfo.institution} • ${projectInfo.location}</p>
                </div>

                <button onclick="nextPage()" class="group bg-teal-600 text-white text-lg md:text-xl px-8 md:px-10 py-3 md:py-4 rounded-full font-bold shadow-xl hover:shadow-2xl hover:bg-teal-700 transition-all flex items-center gap-3 animate-bounce-slow">
                    Empezar Experiencia <i data-lucide="chevron-right" class="group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>`;
        }

        function getContextPageHTML() {
            return `
            <div class="grid md:grid-cols-2 gap-8 items-center animate-fade-in px-4 py-6">
                <div class="space-y-6">
                    <div class="inline-block bg-orange-100 text-orange-700 px-4 py-1 rounded-full font-bold text-sm mb-2">Punto de Partida</div>
                    <h2 class="text-3xl md:text-4xl font-bold text-gray-900">Ayapel: Territorio de Aguas y Memorias</h2>
                    <p class="text-base md:text-lg text-gray-600 leading-relaxed text-justify">
                        Ubicados en el departamento de Córdoba, la <strong>I.E. El Cedro</strong> es un microcosmos de la realidad colombiana. Aquí convergen historias de desplazamiento, pobreza multidimensional (25.7%) y una riqueza cultural inmensa.
                    </p>
                    <div class="grid gap-4">
                        <div class="bg-white p-4 rounded-xl shadow-md flex items-start gap-4 border-l-4 border-teal-500 hover:shadow-lg transition-shadow">
                            <div class="p-2 bg-gray-50 rounded-lg"><i data-lucide="users" class="text-blue-500"></i></div>
                            <div><h4 class="font-bold text-gray-800">Diversidad Étnica</h4><p class="text-sm text-gray-600">Afrodescendientes, Indígenas Zenú y Campesinos conviven en una misma aula.</p></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-md flex items-start gap-4 border-l-4 border-teal-500 hover:shadow-lg transition-shadow">
                            <div class="p-2 bg-gray-50 rounded-lg"><i data-lucide="map-pin" class="text-red-500"></i></div>
                            <div><h4 class="font-bold text-gray-800">Realidad Social</h4><p class="text-sm text-gray-600">Escasez de recursos materiales pero abundancia de saberes tradicionales.</p></div>
                        </div>
                    </div>
                </div>
                <div class="relative mt-8 md:mt-0">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-teal-200 rounded-full blur-3xl opacity-30 -z-10"></div>
                    <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-100 rotate-2 hover:rotate-0 transition-transform duration-500">
                        <div class="bg-gray-200 rounded-xl h-56 md:h-64 w-full flex items-center justify-center mb-4 overflow-hidden relative group">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-4 z-10">
                                <span class="text-white font-bold text-shadow">La Ciénaga de Ayapel</span>
                            </div>
                            <img src="https://i.ytimg.com/vi/5HTggCEOWG4/maxresdefault.jpg" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt="Paisaje Ciénaga">
                        </div>
                        <p class="text-sm text-gray-500 italic text-center">"La escuela no puede ser ajena a la realidad del territorio. Entender el contexto es el primer paso para educar."</p>
                    </div>
                </div>
            </div>`;
        }

        function getProblemPageHTML() {
            return `
            <div class="max-w-4xl mx-auto text-center animate-slide-up py-6">
                <h2 class="text-3xl md:text-4xl font-bold mb-8 text-gray-900">¿Qué encontramos en el aula?</h2>
                <div class="grid md:grid-cols-3 gap-6 mb-12 px-4">
                    <div class="p-6 rounded-2xl border-2 bg-purple-100 border-purple-300 text-purple-900 flex flex-col items-center hover:-translate-y-2 transition-transform duration-300">
                        <h3 class="font-bold text-xl mb-2">Silencios Incomprendidos</h3>
                        <p class="text-sm opacity-90">El silencio del estudiante Zenú era visto como apatía, cuando en realidad es señal de respeto.</p>
                    </div>
                    <div class="p-6 rounded-2xl border-2 bg-orange-100 border-orange-300 text-orange-900 flex flex-col items-center hover:-translate-y-2 transition-transform duration-300">
                        <h3 class="font-bold text-xl mb-2">Voces Juzgadas</h3>
                        <p class="text-sm opacity-90">El tono alto y corporalidad del estudiante Afro era sancionado como indisciplina.</p>
                    </div>
                    <div class="p-6 rounded-2xl border-2 bg-red-100 border-red-300 text-red-900 flex flex-col items-center hover:-translate-y-2 transition-transform duration-300">
                        <h3 class="font-bold text-xl mb-2">Saber Desvalorizado</h3>
                        <p class="text-sm opacity-90">'Violencia Simbólica': El currículo oficial ignoraba la pesca, el agro y la tradición oral.</p>
                    </div>
                </div>
                <div class="bg-teal-900 text-white p-8 rounded-3xl shadow-2xl relative overflow-hidden mx-4">
                    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-400 to-red-500"></div>
                    <i data-lucide="lightbulb" class="w-12 h-12 text-yellow-400 mb-4 mx-auto animate-pulse"></i>
                    <h3 class="text-2xl font-bold mb-2">El Cortocircuito Comunicativo</h3>
                    <p class="text-teal-100 max-w-2xl mx-auto text-lg">"No eran problemas de conducta. Eran códigos culturales diferentes chocando en un espacio que no estaba preparado para traducirlos."</p>
                </div>
            </div>`;
        }

        function getSolutionPageHTML() {
            return `
            <div class="flex flex-col h-full animate-fade-in py-6">
                <div class="text-center mb-8">
                    <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">La Solución: Círculos de Diálogo</h2>
                    <p class="text-gray-500">Rompemos la fila para mirarnos a los ojos</p>
                </div>
                <div class="relative max-w-5xl mx-auto w-full grid md:grid-cols-2 gap-8 md:gap-12 items-center px-4">
                    <div class="order-2 md:order-1 space-y-4">
                        <div class="flex gap-4 p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border-l-4 border-teal-500">
                            <div class="flex-shrink-0 w-10 h-10 bg-teal-600 text-white rounded-full flex items-center justify-center font-bold text-lg">1</div>
                            <div><h3 class="font-bold text-gray-800 text-lg">Romper la Jerarquía</h3><p class="text-gray-600">Al sentarnos en círculo, nadie está atrás y nadie está adelante. Todos ocupan la primera fila.</p></div>
                        </div>
                        <div class="flex gap-4 p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border-l-4 border-teal-500">
                            <div class="flex-shrink-0 w-10 h-10 bg-teal-600 text-white rounded-full flex items-center justify-center font-bold text-lg">2</div>
                            <div><h3 class="font-bold text-gray-800 text-lg">El Objeto de la Palabra</h3><p class="text-gray-600">Solo habla quien tiene el objeto. Los demás activan la escucha profunda y respetuosa.</p></div>
                        </div>
                        <div class="flex gap-4 p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border-l-4 border-teal-500">
                            <div class="flex-shrink-0 w-10 h-10 bg-teal-600 text-white rounded-full flex items-center justify-center font-bold text-lg">3</div>
                            <div><h3 class="font-bold text-gray-800 text-lg">Validación Cultural</h3><p class="text-gray-600">Se permite el relato, la anécdota y la emoción como formas válidas de conocimiento.</p></div>
                        </div>
                    </div>
                    <div class="order-1 md:order-2 flex justify-center py-4">
                        <div class="relative w-64 h-64 md:w-80 md:h-80">
                            <div class="absolute inset-0 rounded-full border-4 border-dashed border-teal-200 animate-spin-slow"></div>
                            <div class="absolute inset-4 rounded-full bg-white shadow-inner flex items-center justify-center">
                                <div class="text-center p-6">
                                    <i data-lucide="users" class="w-16 h-16 text-teal-600 mx-auto mb-2"></i>
                                    <h3 class="font-bold text-teal-800 text-xl">Diálogo<br/>Intercultural</h3>
                                </div>
                            </div>
                            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-5 bg-white p-3 rounded-full shadow-lg text-orange-600"><i data-lucide="message-circle"></i></div>
                            <div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-5 bg-white p-3 rounded-full shadow-lg text-purple-600"><i data-lucide="heart"></i></div>
                            <div class="absolute left-0 top-1/2 -translate-x-5 -translate-y-1/2 bg-white p-3 rounded-full shadow-lg text-blue-600"><i data-lucide="music"></i></div>
                            <div class="absolute right-0 top-1/2 translate-x-5 -translate-y-1/2 bg-white p-3 rounded-full shadow-lg text-green-600"><i data-lucide="star"></i></div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function getToolsPageHTML() {
            const cardsHTML = toolsData.map(tool => {
                const isActive = activeToolId === tool.id;
                return `
                <div onclick="toggleTool(${tool.id})" class="cursor-pointer rounded-3xl overflow-hidden shadow-lg transition-all duration-500 transform ${isActive ? 'scale-105 ring-4 ring-teal-200' : 'hover:-translate-y-2'}">
                    <div class="${tool.color} p-8 flex flex-col items-center justify-center h-48">
                        <div class="bg-white/20 p-4 rounded-full mb-4 backdrop-blur-sm">
                            <i data-lucide="${tool.icon}" class="text-white w-8 h-8"></i>
                        </div>
                        <h3 class="text-white text-xl font-bold text-center">${tool.title}</h3>
                    </div>
                    <div class="bg-white p-6 h-48 flex items-center justify-center">
                        ${isActive 
                            ? `<p class="text-gray-700 text-center animate-fade-in leading-relaxed">${tool.content}</p>` 
                            : `<div class="text-center"><span class="text-sm font-bold text-gray-400 uppercase tracking-widest">Ver detalle</span><div class="mt-2 w-8 h-1 bg-gray-200 mx-auto rounded-full"></div></div>`
                        }
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="w-full max-w-5xl mx-auto animate-fade-in py-6">
                <h2 class="text-3xl font-bold text-center mb-2">Caja de Herramientas</h2>
                <p class="text-center text-gray-500 mb-8">Recursos didácticos listos para usar en el aula (Haz clic para ver)</p>
                <div class="grid md:grid-cols-3 gap-6 px-4">
                    ${cardsHTML}
                </div>
                <div class="mt-8 md:mt-12 bg-blue-50 p-6 rounded-2xl border border-blue-100 flex items-center gap-4 mx-4">
                    <i data-lucide="info" class="text-blue-500 flex-shrink-0"></i>
                    <p class="text-blue-800 text-sm md:text-base"><strong>Tip de implementación:</strong> Comienza con sesiones cortas de 15 minutos. La constancia es más importante que la duración.</p>
                </div>
            </div>`;
        }

        function getTeacherTipsPageHTML() {
            const tipsHTML = tipsData.map((tip, idx) => `
                <div class="group bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-gray-100 transition-all cursor-default">
                    <h3 class="text-xl font-bold text-teal-800 mb-2 group-hover:text-teal-600 flex items-center justify-between">
                        ${idx + 1}. ${tip.title}
                        <i data-lucide="chevron-right" class="opacity-0 group-hover:opacity-100 transition-opacity text-teal-400"></i>
                    </h3>
                    <p class="text-gray-600 leading-relaxed">${tip.text}</p>
                </div>
            `).join('');

            return `
            <div class="max-w-4xl mx-auto animate-slide-up py-6 px-4">
                <div class="flex items-center gap-4 mb-8">
                    <div class="bg-teal-600 text-white p-3 rounded-xl"><i data-lucide="users" class="w-8 h-8"></i></div>
                    <div>
                        <h2 class="text-3xl font-bold text-gray-900">Guía para Docentes</h2>
                        <p class="text-gray-500">Recomendaciones pedagógicas basadas en la experiencia</p>
                    </div>
                </div>
                <div class="space-y-4">${tipsHTML}</div>
                <div class="mt-10 text-center"><p class="text-sm text-gray-400 italic">Basado en teorías de: Honneth (Reconocimiento), Bourdieu (Capital Cultural) y Gumperz (Códigos Comunicativos).</p></div>
            </div>`;
        }

        function getCreditsPageHTML() {
            return `
            <div class="text-center animate-fade-in flex flex-col items-center justify-center h-full py-8">
                <div class="mb-6 relative">
                    <div class="absolute inset-0 bg-teal-500 rounded-full blur-2xl opacity-20"></div>
                    <i data-lucide="home" class="w-20 h-20 text-teal-700 relative z-10"></i>
                </div>
                <h2 class="text-4xl font-bold text-gray-900 mb-6">Gracias</h2>
                <p class="text-xl text-gray-600 max-w-2xl mx-auto mb-12 px-4">"La convivencia no se enseña en el tablero, se construye en el círculo. Gracias por ser parte de este cambio."</p>
                <div class="bg-white p-8 rounded-3xl shadow-xl w-11/12 md:max-w-md border-t-8 border-teal-500 mx-auto">
                    <h3 class="text-gray-400 font-bold uppercase tracking-wider text-sm mb-4">Realizado por</h3>
                    <div class="space-y-3">
                        ${projectInfo.authors.map(a => `<div class="font-bold text-gray-800 text-lg">${a}</div>`).join('')}
                    </div>
                    <div class="mt-8 pt-8 border-t border-gray-100 text-sm text-gray-500">
                        <p>${projectInfo.institution}</p>
                        <p class="font-semibold text-teal-600">${projectInfo.location} - ${projectInfo.year}</p>
                        <p class="mt-2 text-xs">Maestría en Educación • Corporación Universitaria Iberoamericana</p>
                    </div>
                </div>
            </div>`;
        }

        // --- MAIN RENDER FUNCTION ---
        function render() {
            const container = document.getElementById('app-content');
            let contentHTML = '';

            // Update Page Indicator
            document.getElementById('page-indicator').textContent = `${pages[currentPage].title} (${currentPage + 1}/${pages.length})`;

            // Generate Main Content
            switch(currentPage) {
                case 0: contentHTML = getCoverPageHTML(); break;
                case 1: contentHTML = getContextPageHTML(); break;
                case 2: contentHTML = getProblemPageHTML(); break;
                case 3: contentHTML = getSolutionPageHTML(); break;
                case 4: contentHTML = getToolsPageHTML(); break;
                case 5: contentHTML = getTeacherTipsPageHTML(); break;
                case 6: contentHTML = getCreditsPageHTML(); break;
            }
            container.innerHTML = contentHTML;

            // Update Progress Dots
            const dotsContainer = document.getElementById('progress-dots');
            dotsContainer.innerHTML = pages.map((_, idx) => `
                <div class="h-2 rounded-full transition-all duration-300 ${currentPage === idx ? 'w-8 bg-teal-600' : 'w-2 bg-gray-300'}"></div>
            `).join('');

            // Update Buttons State
            const prevBtn = document.getElementById('btn-prev');
            const nextBtn = document.getElementById('btn-next');
            
            prevBtn.disabled = currentPage === 0;
            prevBtn.classList.toggle('opacity-30', currentPage === 0);
            prevBtn.classList.toggle('cursor-not-allowed', currentPage === 0);

            nextBtn.disabled = currentPage === pages.length - 1;
            nextBtn.classList.toggle('opacity-30', currentPage === pages.length - 1);
            nextBtn.classList.toggle('cursor-not-allowed', currentPage === pages.length - 1);

            // Re-initialize Icons
            lucide.createIcons();
            
            // Scroll to top
            const main = document.querySelector('main');
            if(main) main.scrollTo(0,0);
        }

        // Initial Render
        window.onload = init;

    </script>
</body>
</html>
