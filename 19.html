<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Escalado adecuado en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake: Multiplicaciones y Movimiento Natural</title>
  <style>
    body {
      margin: 0;
      background: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #gameCanvas {
      background: #222;
      border: 2px solid #fff;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Configuración de la cuadrícula y canvas responsivo
    const gridSize = 20;
    let canvasSize;
    function resizeCanvas() {
      let size = Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.9);
      size = size - (size % gridSize); // asegurar que sea múltiplo de gridSize
      canvas.width = size;
      canvas.height = size;
      canvasSize = size;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Variables del juego
    let score = 0;
    let snake = [{ x: gridSize * 5, y: gridSize * 5 }];
    let direction = { x: 1, y: 0 }; // dirección inicial a la derecha
    let nextDirection = { x: 1, y: 0 };

    // Variables para el movimiento ondulado (efecto natural)
    let wavePhase = 0;
    const amplitude = 4;    // amplitud del movimiento (en píxeles)
    const phaseShift = 0.5; // desfase entre segmentos

    // Variables para la expresión facial de la serpiente
    // Valores posibles: "neutral", "happy" (feliz) o "sad" (triste)
    let faceExpression = "neutral";
    let faceTimer = 0; // tiempo (en ms) para mantener la expresión alterada

    // Variables para la pregunta de multiplicaciones y alimentos
    let currentQuestion = { a: 2, b: 2 };
    let foods = []; // Cada alimento: { x, y, value, isCorrect }

    // Función para obtener una posición aleatoria en la cuadrícula que no colisione con la serpiente
    function randomFoodPosition() {
      let pos, valid = false;
      while (!valid) {
        pos = {
          x: Math.floor(Math.random() * (canvasSize / gridSize)) * gridSize,
          y: Math.floor(Math.random() * (canvasSize / gridSize)) * gridSize
        };
        valid = true;
        for (let segment of snake) {
          if (segment.x === pos.x && segment.y === pos.y) {
            valid = false;
            break;
          }
        }
      }
      return pos;
    }

    // Genera una pregunta de multiplicación y crea dos alimentos sin pistas (mismo color)
    function generateQuestion() {
      let a = Math.floor(Math.random() * 8) + 2; // números entre 2 y 9
      let b = Math.floor(Math.random() * 8) + 2;
      let correctAnswer = a * b;
      let wrongAnswer;
      do {
        wrongAnswer = Math.floor(Math.random() * (81 - 4 + 1)) + 4; // entre 4 y 81
      } while (wrongAnswer === correctAnswer);
      currentQuestion = { a, b };
      let food1 = Object.assign(randomFoodPosition(), { value: correctAnswer, isCorrect: true });
      let food2 = Object.assign(randomFoodPosition(), { value: wrongAnswer, isCorrect: false });
      // Evitar que se solapen
      while (food1.x === food2.x && food1.y === food2.y) {
        food2 = Object.assign(randomFoodPosition(), { value: wrongAnswer, isCorrect: false });
      }
      foods = [food1, food2];
    }
    generateQuestion();

    // Manejo de controles de teclado
    document.addEventListener("keydown", function(e) {
      switch (e.key) {
        case "ArrowUp":
          if (direction.y === 0) { nextDirection = { x: 0, y: -1 }; }
          break;
        case "ArrowDown":
          if (direction.y === 0) { nextDirection = { x: 0, y: 1 }; }
          break;
        case "ArrowLeft":
          if (direction.x === 0) { nextDirection = { x: -1, y: 0 }; }
          break;
        case "ArrowRight":
          if (direction.x === 0) { nextDirection = { x: 1, y: 0 }; }
          break;
      }
    });

    // Manejo de controles táctiles para dispositivos móviles (swipes)
    let touchStartX = null, touchStartY = null;
    canvas.addEventListener("touchstart", function(e) {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    });
    canvas.addEventListener("touchend", function(e) {
      if (touchStartX === null || touchStartY === null) return;
      const touch = e.changedTouches[0];
      let dx = touch.clientX - touchStartX;
      let dy = touch.clientY - touchStartY;
      touchStartX = null;
      touchStartY = null;
      if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && direction.x === 0) { nextDirection = { x: 1, y: 0 }; }
        else if (dx < 0 && direction.x === 0) { nextDirection = { x: -1, y: 0 }; }
      } else {
        if (dy > 0 && direction.y === 0) { nextDirection = { x: 0, y: 1 }; }
        else if (dy < 0 && direction.y === 0) { nextDirection = { x: 0, y: -1 }; }
      }
    });

    // Función para reiniciar el juego
    function resetGame() {
      alert("¡Juego terminado! Puntuación: " + score);
      score = 0;
      snake = [{ x: gridSize * 5, y: gridSize * 5 }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      faceExpression = "neutral";
      faceTimer = 0;
      generateQuestion();
    }

    // Calcula puntos suavizados para dibujar la serpiente con un movimiento ondulatorio
    function getSmoothedSnakePoints() {
      let points = [];
      for (let i = 0; i < snake.length; i++) {
        let point = snake[i];
        // Calcular vector tangente
        let tangent;
        if (i === 0) {
          if (snake.length > 1) {
            tangent = { x: snake[0].x - snake[1].x, y: snake[0].y - snake[1].y };
          } else {
            tangent = { x: direction.x, y: direction.y };
          }
        } else {
          tangent = { x: snake[i].x - snake[i - 1].x, y: snake[i].y - snake[i - 1].y };
        }
        let mag = Math.sqrt(tangent.x * tangent.x + tangent.y * tangent.y);
        if (mag === 0) { tangent = { x: 0, y: 0 }; } else { tangent.x /= mag; tangent.y /= mag; }
        // Vector perpendicular (para aplicar el desplazamiento)
        let perp = { x: -tangent.y, y: tangent.x };
        let offsetVal = amplitude * Math.sin(wavePhase + i * phaseShift);
        points.push({ x: point.x + perp.x * offsetVal, y: point.y + perp.y * offsetVal });
      }
      return points;
    }

    // Dibuja la cabeza de la serpiente con la expresión facial indicada
    function drawSnakeHead(x, y, expression) {
      // Cabeza: círculo verde
      ctx.fillStyle = "#0f0";
      ctx.beginPath();
      ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2, 0, Math.PI * 2);
      ctx.fill();
      
      // Ojos
      ctx.fillStyle = "#000";
      let eyeRadius = 2;
      let eyeOffsetX = gridSize/6;
      let eyeOffsetY = gridSize/6;
      ctx.beginPath();
      ctx.arc(x + gridSize/2 - eyeOffsetX, y + gridSize/2 - eyeOffsetY, eyeRadius, 0, Math.PI * 2);
      ctx.arc(x + gridSize/2 + eyeOffsetX, y + gridSize/2 - eyeOffsetY, eyeRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Boca según la expresión:
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (expression === "happy") {
        // Sonriente: arco ascendente
        ctx.arc(x + gridSize/2, y + gridSize/2 + 2, 4, 0, Math.PI, false);
      } else if (expression === "sad") {
        // Triste: arco descendente
        ctx.arc(x + gridSize/2, y + gridSize/2 + 6, 4, Math.PI, 0, false);
      } else {
        // Neutral: línea recta
        ctx.moveTo(x + gridSize/2 - 4, y + gridSize/2 + 4);
        ctx.lineTo(x + gridSize/2 + 4, y + gridSize/2 + 4);
      }
      ctx.stroke();
    }

    // Dibuja la serpiente como una línea suave (cuerpo ondulado) y la cabeza con expresión
    function drawSnake() {
      let smoothedPoints = getSmoothedSnakePoints();
      // Dibuja el cuerpo (excluyendo la cabeza) con trazo grueso y redondeado
      if (smoothedPoints.length > 1) {
        ctx.strokeStyle = "#0f0";
        ctx.lineWidth = gridSize;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(smoothedPoints[0].x + gridSize/2, smoothedPoints[0].y + gridSize/2);
        for (let i = 1; i < smoothedPoints.length; i++) {
          ctx.lineTo(smoothedPoints[i].x + gridSize/2, smoothedPoints[i].y + gridSize/2);
        }
        ctx.stroke();
      }
      // Dibuja la cabeza con la expresión actual
      if (smoothedPoints.length > 0) {
        drawSnakeHead(smoothedPoints[0].x, smoothedPoints[0].y, faceExpression);
      }
    }

    // Dibuja las frutas (alimentos) sin diferenciar por color
    function drawFoods() {
      for (let food of foods) {
        ctx.fillStyle = "#FFA500"; // naranja para la fruta
        ctx.beginPath();
        ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2, 0, Math.PI * 2);
        ctx.fill();
        // Dibuja el valor en el centro
        ctx.fillStyle = "#000";
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(food.value, food.x + gridSize/2, food.y + gridSize/2);
      }
    }

    // Actualiza la lógica del juego
    function update() {
      // Actualiza la expresión facial: se decrementa el temporizador y se vuelve a "neutral"
      if (faceTimer > 0) {
        faceTimer -= gameSpeed;
        if (faceTimer <= 0) {
          faceExpression = "neutral";
        }
      }

      direction = nextDirection;
      let head = { x: snake[0].x + direction.x * gridSize, y: snake[0].y + direction.y * gridSize };

      // Colisión con los bordes
      if (head.x < 0 || head.x >= canvasSize || head.y < 0 || head.y >= canvasSize) {
        resetGame();
        return;
      }
      // Colisión con el cuerpo
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          resetGame();
          return;
        }
      }
      snake.unshift(head);

      // Verifica colisión con algún alimento
      let ateFood = false;
      for (let i = 0; i < foods.length; i++) {
        if (head.x === foods[i].x && head.y === foods[i].y) {
          ateFood = true;
          if (foods[i].isCorrect) {
            score += 10;
            faceExpression = "happy";
            faceTimer = 2000; // 2 segundos de expresión feliz
          } else {
            if (snake.length > 1) {
              snake.pop();
            } else {
              resetGame();
              return;
            }
            faceExpression = "sad";
            faceTimer = 2000; // 2 segundos de expresión triste
          }
          generateQuestion();
          break;
        }
      }
      if (!ateFood) {
        snake.pop();
      }
    }

    // Dibuja la interfaz (pregunta y puntuación)
    function drawHUD() {
      ctx.fillStyle = "#fff";
      ctx.font = "20px sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(`¿Cuánto es ${currentQuestion.a} x ${currentQuestion.b}?`, 10, 10);
      ctx.fillText(`Puntuación: ${score}`, 10, canvas.height - 30);
    }

    // Función principal de dibujo
    function draw() {
      wavePhase += 0.1;
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawHUD();
      drawFoods();
      drawSnake();
    }

    function gameLoop() {
      update();
      draw();
    }

    let gameSpeed = 100; // intervalo en ms
    setInterval(gameLoop, gameSpeed);
  </script>
</body>
</html>
