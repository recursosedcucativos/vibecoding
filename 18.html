<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Hace que el sitio se escale adecuadamente en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Animado para Niños (Responsive y Táctil)</title>
  <style>
    body {
      margin: 0;
      background: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #gameCanvas {
      background: #222;
      border: 2px solid #fff;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Configuración de la cuadrícula
    const gridSize = 20;
    let canvasSize; // Se actualizará en resizeCanvas()

    // Variables del juego
    let score = 0;
    let snake = [{x: gridSize * 5, y: gridSize * 5}];
    let direction = {x: 1, y: 0}; // Movimiento inicial a la derecha
    let nextDirection = {x: 1, y: 0};
    let food = {x: 0, y: 0};

    // Función para colocar la comida en una posición aleatoria de la cuadrícula
    function placeFood() {
      food.x = Math.floor(Math.random() * (canvasSize / gridSize)) * gridSize;
      food.y = Math.floor(Math.random() * (canvasSize / gridSize)) * gridSize;
    }

    // Variables para la animación del sprite de la cabeza
    let spriteFrame = 0;
    let spriteTimer = 0;
    const spriteInterval = 200; // ms

    let gameSpeed = 100; // ms por frame

    // Función para redimensionar el canvas según la pantalla
    function resizeCanvas() {
      let size = Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.9);
      size = size - (size % gridSize); // Asegurar que sea múltiplo de gridSize
      canvas.width = size;
      canvas.height = size;
      canvasSize = size;
      placeFood();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas(); // Inicialización del tamaño del canvas

    // Control táctil para dispositivos móviles
    let touchStartX = null;
    let touchStartY = null;

    canvas.addEventListener("touchstart", function(e) {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    });

    canvas.addEventListener("touchend", function(e) {
      if(touchStartX === null || touchStartY === null) return;
      const touch = e.changedTouches[0];
      let dx = touch.clientX - touchStartX;
      let dy = touch.clientY - touchStartY;
      // Reiniciamos los valores
      touchStartX = null;
      touchStartY = null;
      // Umbral para considerar el deslizamiento como válido
      if(Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
      if(Math.abs(dx) > Math.abs(dy)) {
        if(dx > 0 && direction.x === 0) {
          nextDirection = {x: 1, y: 0};
        } else if(dx < 0 && direction.x === 0) {
          nextDirection = {x: -1, y: 0};
        }
      } else {
        if(dy > 0 && direction.y === 0) {
          nextDirection = {x: 0, y: 1};
        } else if(dy < 0 && direction.y === 0) {
          nextDirection = {x: 0, y: -1};
        }
      }
    });

    // Controles de teclado para escritorio
    document.addEventListener("keydown", function(e){
      switch(e.key){
        case "ArrowUp":
          if(direction.y === 0) { nextDirection = {x: 0, y: -1}; }
          break;
        case "ArrowDown":
          if(direction.y === 0) { nextDirection = {x: 0, y: 1}; }
          break;
        case "ArrowLeft":
          if(direction.x === 0) { nextDirection = {x: -1, y: 0}; }
          break;
        case "ArrowRight":
          if(direction.x === 0) { nextDirection = {x: 1, y: 0}; }
          break;
      }
    });

    // Función para reiniciar el juego
    function resetGame() {
      alert("¡Juego terminado! Puntuación: " + score);
      score = 0;
      snake = [{x: gridSize * 5, y: gridSize * 5}];
      direction = {x: 1, y: 0};
      nextDirection = {x: 1, y: 0};
      placeFood();
    }

    // Actualización de la lógica del juego
    function update() {
      direction = nextDirection;
      let head = { x: snake[0].x + direction.x * gridSize, y: snake[0].y + direction.y * gridSize };

      // Colisión con los bordes
      if(head.x < 0 || head.x >= canvasSize || head.y < 0 || head.y >= canvasSize) {
        resetGame();
        return;
      }
      // Colisión con el cuerpo
      for(let i = 0; i < snake.length; i++){
        if(head.x === snake[i].x && head.y === snake[i].y){
          resetGame();
          return;
        }
      }

      snake.unshift(head);

      // Si come la comida, aumenta la puntuación y se genera nueva comida
      if(head.x === food.x && head.y === food.y){
        score++;
        placeFood();
      } else {
        snake.pop();
      }
    }

    // Dibuja la cabeza de la serpiente con animación de sprite
    function drawSnakeHead(x, y) {
      // Base de la cabeza (círculo verde)
      ctx.fillStyle = "#0f0";
      ctx.beginPath();
      ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2, 0, Math.PI * 2);
      ctx.fill();

      // Ojos
      ctx.fillStyle = "#000";
      let eyeRadius = 2;
      let eyeOffsetX = gridSize/6;
      let eyeOffsetY = gridSize/6;
      ctx.beginPath();
      ctx.arc(x + gridSize/2 - eyeOffsetX, y + gridSize/2 - eyeOffsetY, eyeRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + gridSize/2 + eyeOffsetX, y + gridSize/2 - eyeOffsetY, eyeRadius, 0, Math.PI * 2);
      ctx.fill();

      // Boca animada (alternando dos estados)
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      if(spriteFrame === 0){
        ctx.beginPath();
        ctx.moveTo(x + gridSize/2 - 4, y + gridSize/2 + 4);
        ctx.lineTo(x + gridSize/2 + 4, y + gridSize/2 + 4);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(x + gridSize/2, y + gridSize/2 + 2, 4, 0, Math.PI, false);
        ctx.stroke();
      }
    }

    // Dibuja todos los elementos del juego
    function draw() {
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar la comida
      ctx.fillStyle = "#ff0";
      ctx.fillRect(food.x, food.y, gridSize, gridSize);

      // Dibujar la serpiente
      for(let i = 0; i < snake.length; i++){
        if(i === 0){
          drawSnakeHead(snake[i].x, snake[i].y);
        } else {
          ctx.fillStyle = "#0f0";
          ctx.fillRect(snake[i].x, snake[i].y, gridSize, gridSize);
        }
      }

      // Dibujar la puntuación
      ctx.fillStyle = "#fff";
      ctx.font = "20px sans-serif";
      ctx.fillText("Puntuación: " + score, 10, 20);
    }

    // Bucle principal del juego
    function gameLoop() {
      update();
      draw();
    }

    setInterval(() => {
      spriteTimer += gameSpeed;
      if(spriteTimer >= spriteInterval){
        spriteFrame = (spriteFrame + 1) % 2;
        spriteTimer = 0;
      }
      gameLoop();
    }, gameSpeed);
  </script>
</body>
</html>
